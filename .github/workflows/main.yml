import 'dart:ui';

enum RegionType { speechBubble, box, freeText, unknown }

class TextRegion {
  String originalText;
  String translatedText;
  Rect rect;
  RegionType type;
  bool enabled;
  bool vertical;
  double confidence;

  TextRegion({
    required this.originalText,
    required this.translatedText,
    required this.rect,
    this.type = RegionType.unknown,
    this.enabled = true,
    this.vertical = false,
    this.confidence = 0.5,
  });

  TextRegion copy() => TextRegion(
    originalText: originalText,
    translatedText: translatedText,
    rect: rect,
    type: type,
    enabled: enabled,
    vertical: vertical,
    confidence: confidence,
  );
}
